[project]
name = "aprntc"
version = "0.0.1"
description = "Apprentice — a child agent that shadows a live parent agent, distills lessons, and is promoted to a measurably better successor (codename Shadow)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aprntc" }]
keywords = ["llm", "agents", "self-improving", "champion-challenger", "rag", "byteplus"]

# Core stays DEPENDENCY-LIGHT on purpose (stdlib only). Heavy deps live in
# optional extras so a user installs only what their collector needs.
dependencies = []

[project.optional-dependencies]
# BytePlus adapters: ModelArk (LLM) + VikingDB (memory) over REST.
byteplus = ["httpx>=0.27"]
# Egress-proxy collector (wraps self-hosted LiteLLM via a CustomLogger plugin).
proxy = ["litellm>=1.0"]
# OTel ingester (telemetry boundary) — also the MCP path (gateway exports OTel).
otel = [
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]
# A2A interceptor (agent boundary) — capture tasks/artifacts from an A2A server.
# The collector itself is pure-stdlib (dict-in/Episode-out); the SDK is only needed
# to run a live A2A server/proxy in front of the agents.
a2a = ["a2a-sdk>=0.2"]
# Postgres-backed TrajectoryStore — for multi-worker uvicorn deployments where
# SQLite's single-writer lock becomes a bottleneck.
postgres = ["psycopg[binary]>=3.1"]
# Vector-DB backend extras (the default LocalMemoryStore needs no extras).
# Each pulls in just its client; embedders are kept separate.
chroma   = ["chromadb>=0.5"]
pinecone = ["pinecone>=4.0"]
aws      = ["opensearch-py>=2.0"]
# UI for the promotion gate (review diff / metrics / promote / rollback).
ui = ["streamlit>=1.40"]
# Web dashboard backend (REST API over gate/lineage/trajectories/memory).
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
# Everything (excludes dev/test tooling).
all = ["aprntc[byteplus,proxy,otel,a2a,postgres,chroma,pinecone,aws,ui,web]"]
# Dev/test only. `volcengine` is the byte-for-byte ORACLE for our hand-rolled
# Signature-V4 signer — it is NOT a runtime dependency (we sign over REST).
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "volcengine",  # signing oracle (dev-only); see tests/test_signing_oracle.py
  "fastapi>=0.110",  # web API tests use TestClient
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aprntc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "oracle: validates our signer byte-for-byte against the volcengine SDK (needs `volcengine` installed)",
  "live: hits real BytePlus endpoints (needs real keys in .env)",
]
